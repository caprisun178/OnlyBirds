name: Deploy dev Pages

# Publishes all of frontend/ to GitHub Pages on every push to dev/current, for
# a hosted dev/staging preview of the app (frontend/index.html redirects to
# src/preview.html, which opens on Home — no separate landing page).
# Separate from production (which isn't on Pages) — see docs/deployment.md.
#
# One-time setup: repo Settings > Pages > Build and deployment > Source:
# "GitHub Actions". After that this workflow handles every deploy.

on:
  push:
    branches: [dev/current]

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
