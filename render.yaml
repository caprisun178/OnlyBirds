# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the FastAPI backend as a web service. Create the service by pointing
# Render at this repo (New > Blueprint). Secrets are NOT stored here: every
# `sync: false` var must be filled in the Render dashboard after the first
# deploy (Dashboard > the service > Environment).

services:
  - type: web
    name: onlybirds-dev
    runtime: python
    plan: standard                   # 2GB RAM: the photo-ID model doesn't fit in 512MB (free/starter)
    rootDir: backend
    # Second step downloads the photo-ID model and precomputes its species
    # embeddings into HF_HOME (inside the project, so Render keeps them for
    # the running service) — see app/dao/bioclip_classifier.py `__main__`.
    buildCommand: pip install -r requirements.txt && (python -m app.dao.bioclip_classifier || echo "Photo ID model prefetch failed; it will load on first use")
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true                 # redeploy on every push to the default branch
    envVars:
      - key: HF_HOME                  # model weights + saved embeddings; must be under the project dir to survive from build to runtime
        value: /opt/render/project/src/backend/.cache/huggingface
      - key: PHOTO_ID_ENABLED         # false = hide photo ID (needed on a 512MB instance); describe & guess still works
        value: "true"
      - key: PYTHON_VERSION
        value: "3.13.14"
      - key: EBIRD_API_KEY           # set in dashboard — https://ebird.org/api/keygen
        sync: false
      - key: DATABASE_URL            # set in dashboard — Neon > Dashboard > Connection string
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:3000,https://caprisun178.github.io
      - key: SUPABASE_URL             # set in dashboard — Supabase project > Settings > API
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY   # set in dashboard — same page, service_role/secret key
        sync: false
      - key: SMTP_HOST                # set in dashboard — see backend/.env.example
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: REPORT_EMAIL_TO
        sync: false
      - key: GOOGLE_CLIENT_ID         # set in dashboard — Google Cloud > Credentials > OAuth client (Web); see backend/.env.example
        sync: false
      - key: SESSION_SECRET           # set in dashboard — long random string, NOT the same as your local one
        sync: false
      - key: ADMIN_EMAILS             # set in dashboard — comma-separated Google emails allowed on admin screens
        sync: false
