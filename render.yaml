# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the FastAPI backend as a web service. Create the service by pointing
# Render at this repo (New > Blueprint). Secrets are NOT stored here: every
# `sync: false` var must be filled in the Render dashboard after the first
# deploy (Dashboard > the service > Environment).

services:
  - type: web
    name: onlybirds-dev
    runtime: python
    plan: free                       # sleeps after 15 min idle; fine for dev
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true                 # redeploy on every push to the default branch
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.14"
      - key: EBIRD_API_KEY           # set in dashboard — https://ebird.org/api/keygen
        sync: false
      - key: DATABASE_URL            # set in dashboard — Neon > Dashboard > Connection string
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:3000,https://caprisun178.github.io
      - key: SUPABASE_URL             # set in dashboard — Supabase project > Settings > API
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY   # set in dashboard — same page, service_role/secret key
        sync: false
      - key: SMTP_HOST                # set in dashboard — see backend/.env.example
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: REPORT_EMAIL_TO
        sync: false
