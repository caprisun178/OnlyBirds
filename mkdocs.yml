site_name: Only Birds
site_description: >-
  iNaturalist + eBird + personal life list — developer documentation.
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Set up & test your changes: setup-and-test.md
  - Verify your setup: verify-setup.md
  - Environment Setup: index.md
  - Architecture: architecture.md
  - Building a screen: frontend-screens.md
  - Features:
      - Overview: features/overview.md
      - Database & migrations: features/database.md
      - Life List page: features/life-list.md
      - Add Observation: features/add-observation.md
      - User profiles: features/user-profiles.md
      - Stickers: features/stickers.md
      - Pinned birds: features/pinned-birds.md
      - Bird information page: features/bird-info.md
      - Photo-based bird ID: features/bird-id.md
      - Explore map: features/explore-map.md
      - Plan a trip: features/plan-a-trip.md
      - Test your skill: features/test-your-skill.md
      - Community: features/community.md
      - Progressive Web App: features/pwa.md
  - Backend API: backend.md
  - eBird API: ebird-api.md
  - Deployment: deployment.md
  - Contributing: contributing.md
